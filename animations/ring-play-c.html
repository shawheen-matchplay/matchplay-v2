<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ring Play C — MatchPlay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <!-- Ring play, version C: as A (rings ignore the mouse; drag one onto another to merge them), and rings that drift close also merge by themselves. Links split again after 2-4 seconds. The behaviour is in ring-play.js. -->
  <style>
    :root { --ground: #0E0E11; --ink: rgba(255,255,255,.5); }
    html, body { margin: 0; height: 100%; background: var(--ground); overflow: hidden; }
    svg {
      position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block;
      touch-action: none; -webkit-user-select: none; user-select: none;
    }
    svg.can-grab { cursor: grab; }
    svg.grabbing { cursor: grabbing; }
    svg path { transition: stroke .6s ease; }
    .hint, .reset { font: 500 12px/1.4 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .12em; text-transform: uppercase; }
    .hint {
      position: fixed; margin: 0; pointer-events: none; color: var(--ink);
      left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      max-width: calc(100% - 140px);
    }
    .reset {
      position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      padding: 8px 14px; border: 1px solid rgba(255,255,255,.2); border-radius: 999px;
      background: rgba(0,0,0,.35); color: rgba(255,255,255,.85); cursor: pointer; line-height: 1;
    }
    .reset:hover { color: #fff; border-color: rgba(255,255,255,.45); }
    .embed { --ground: #000; }
    .embed .reset { display: none; }
    .embed .hint { font-size: 10px; color: rgba(255,255,255,.4); left: 20px; bottom: 16px; max-width: calc(100% - 40px); }
    .embed svg { touch-action: pan-y; }           /* the page still scrolls by touch over the box */
  </style>
</head>
<body>
  <svg id="stage" role="img" aria-label="Floating rings that can be dragged together to form MatchPlay links"></svg>
  <p class="hint">Drag a ring onto another to link them, or watch them link up as they drift.</p>
  <button class="reset" type="button" id="reset">Reset</button>

  <script>window.RING_PLAY = { mode: "c" };</script>
  <script src="ring-play.js"></script>
</body>
</html>
