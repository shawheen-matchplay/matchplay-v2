# Regenerate the content pages on every push to main.
#
# The blog and stories editors commit their content (post JSON, founders.json,
# photos) straight to main. This rebuilds the pages from it:
#   tools/blog/build.py      blog.html and blog/<post>.html
#   tools/stories/build.py   the founder quotes and story cards in index.html
#                            and founders.html
# and commits them if they changed. Vercel deploys every push to main itself
# (vercel.json: python3 tools/hosting/build.py -> dist/), so a save in an
# editor goes live as two deploys: the content commit, then this rebuild.
# The bot's commit is made with GITHUB_TOKEN, so it cannot trigger this
# workflow again.
name: Build content pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate the blog pages
        run: python3 tools/blog/build.py

      - name: Generate the founder quotes and story cards
        run: python3 tools/stories/build.py

      - name: Commit the generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog.html blog index.html founders.html
          if git diff --cached --quiet; then
            echo "Generated pages already up to date."
          else
            git commit -m "Rebuild generated pages (blog, founder stories)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
