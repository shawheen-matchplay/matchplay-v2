<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MatchPlay Group</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Varela+Round&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f1117;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 4rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    .logo img {
      height: 2rem;
      width: auto;
      display: block;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      align-items: center;
      list-style: none;
    }

    .nav-links a {
      color: #a0a0b0;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 400;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: #ffffff;
    }

    .btn {
      display: inline-block;
      padding: 0.65rem 1.75rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 0.2s, transform 0.15s;
      cursor: pointer;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background-color: #ffffff;
      color: #0f1117;
    }

    .btn-primary:hover {
      background-color: #e0e0e0;
    }

    .btn-outline {
      background-color: transparent;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .btn-outline:hover {
      border-color: rgba(255, 255, 255, 0.5);
    }

    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 4rem 2rem 6rem;
      max-width: 800px;
      margin: 0 auto;
    }

    .hero-tag {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #7a7a8e;
      margin-bottom: 1.5rem;
    }

    .hero h1 {
      font-family: 'Varela Round', sans-serif;
      font-size: 3.5rem;
      font-weight: 400;
      line-height: 1.15;
      margin-bottom: 1.5rem;
      color: #ffffff;
    }

    .hero p {
      font-size: 1.15rem;
      line-height: 1.7;
      color: #a0a0b0;
      max-width: 600px;
      margin-bottom: 2.5rem;
    }

    .hero-actions {
      display: flex;
      gap: 1rem;
    }

    footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.8rem;
      color: #4a4a5a;
    }

    @media (max-width: 768px) {
      nav {
        padding: 1.25rem 1.5rem;
      }

      .nav-links {
        display: none;
      }

      .hero h1 {
        font-size: 2.25rem;
      }

      .hero p {
        font-size: 1rem;
      }

      .hero-actions {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <nav>
    <div class="logo"><img src="assets/logo.png" alt="MatchPlay"></div>
    <ul class="nav-links">
      <li><a href="#">Matches</a></li>
      <li><a href="#">Events</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#" class="btn btn-outline">Log In</a></li>
    </ul>
  </nav>

  <section class="hero">
    <p class="hero-tag">A Syndicate of Funds</p>
    <h1>We help founders get funded.</h1>
    <p>MatchPlay conducts due diligence, navigates founders, and matches them to the right investors at the right time.</p>
    <div class="hero-actions">
      <a href="#" class="btn btn-primary">Get Matched Today</a>
      <a href="#" class="btn btn-outline">Learn More</a>
    </div>
  </section>

  <footer>
    &copy; 2025 MatchPlay Group. All rights reserved.
  </footer>
</body>
</html>
